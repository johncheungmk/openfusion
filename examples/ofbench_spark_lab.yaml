# OpenFusion Lab configuration for the OFBench DGX Spark case study.
# See docs/research/case-study-spark-escalation.md for the full report.
#
# Set base_url to wherever your Ollama instances actually listen. Two engines are
# used here to represent two DGX Spark machines; a single engine works too if all
# models live on one host.

experiment:
  name: ofbench-dev
  description: OFBench dev split for baseline ladder and reliability-weight calibration.
  seed: 42
  max_total_calls: 10
  max_tokens: 32
  temperature: 0.0

dataset:
  path: examples/ofbench_dev.jsonl
  name: ofbench
  split: dev
  answer_mode: exact_or_regex

engines:
  - name: spark1
    type: ollama
    base_url: http://127.0.0.1:11434/v1
    launch: manual
  - name: spark2
    type: ollama
    base_url: http://127.0.0.1:11435/v1
    launch: manual

models:
  - provider_name: qwen3-4b
    engine: spark1
    model: qwen3:4b-instruct
    weight: 1.0
    timeout_seconds: 300
    input_cost_per_million_tokens_usd: 0
    output_cost_per_million_tokens_usd: 0
  - provider_name: llama32-3b
    engine: spark1
    model: llama3.2:3b
    weight: 1.0
    timeout_seconds: 300
    input_cost_per_million_tokens_usd: 0
    output_cost_per_million_tokens_usd: 0
  - provider_name: gemma3-4b
    engine: spark1
    model: gemma3:4b
    weight: 1.0
    timeout_seconds: 300
    input_cost_per_million_tokens_usd: 0
    output_cost_per_million_tokens_usd: 0
  - provider_name: phi4-mini
    engine: spark2
    model: phi4-mini:3.8b
    weight: 1.0
    timeout_seconds: 300
    input_cost_per_million_tokens_usd: 0
    output_cost_per_million_tokens_usd: 0
  - provider_name: llama32-1b
    engine: spark2
    model: llama3.2:1b
    weight: 1.0
    timeout_seconds: 300
    input_cost_per_million_tokens_usd: 0
    output_cost_per_million_tokens_usd: 0

strategies:
  - name: fallback
  - name: majority_vote
  - name: weighted_vote
  - name: self_moa
    self_moa_provider: qwen3-4b
    self_moa_samples: 3
    self_moa_mode: synthesize
  - name: parallel_synthesis
  - name: semantic_vote
  - name: uncertainty_cascade

recommendation:
  objective: balanced
  max_latency_ms: 180000
  prefer_lower_calls: true
