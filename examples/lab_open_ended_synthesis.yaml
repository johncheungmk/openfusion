experiment:
  name: open-ended-synthesis-local
  description: Smoke test mixed-model synthesis on short open-ended prompts.
  seed: 7
  max_examples: 10
  max_total_calls: 6
  max_tokens: 220
  temperature: 0.2

dataset:
  path: examples/open_ended_synthesis_10.jsonl
  name: openfusion-open-ended-synthesis-10
  split: smoke
  answer_mode: exact_or_regex

engines:
  - name: ollama-local
    type: ollama
    base_url: http://127.0.0.1:11434/v1
    launch: manual

models:
  - provider_name: ollama-llama32-3b
    engine: ollama-local
    model: llama3.2:3b
    weight: 1.0
    timeout_seconds: 300

  - provider_name: ollama-qwen3
    engine: ollama-local
    model: qwen3:latest
    weight: 1.0
    timeout_seconds: 300

strategies:
  - name: fallback
  - name: self_moa
    self_moa_provider: ollama-qwen3
    self_moa_samples: 3
    self_moa_mode: synthesize
  - name: parallel_synthesis
  - name: pairwise_rank_fuse
  - name: uncertainty_cascade

recommendation:
  objective: balanced
  max_latency_ms: 180000
  prefer_lower_calls: true
